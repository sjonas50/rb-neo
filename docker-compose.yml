services:
  neo4j:
    image: neo4j:5.25-community
    container_name: rb-neo
    ports:
      - "7474:7474"   # Browser UI -> http://localhost:7474
      - "7687:7687"   # Bolt driver
    environment:
      # Matches .env.example. Change the password in both places for anything real.
      NEO4J_AUTH: neo4j/rbneopass
      NEO4J_server_memory_heap_initial__size: 1G
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_server_memory_pagecache_size: 1G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  neo4j_data:
  neo4j_logs:
