[project]
name = "rb-neo"
version = "0.1.0"
description = "Neo4j graph proof-of-concept for an early-childhood reading assessment & personalization platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "neo4j>=5.25",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "typer>=0.13",
    "python-dotenv>=1.0",
]

[project.scripts]
rb-neo = "rb_neo.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rb_neo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
